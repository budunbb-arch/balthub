{% extends "default/base.html" %}

{% load static %}

{% block title %}{{ trans.head_404 }}{% endblock %}

{% block content %}

<section class="error-page py-5">

    <div class="container text-center">

        <h1 class="display-1 fw-bold">
            {{ trans.head_404 }}
        </h1>

        <p class="lead mb-4">
            {{ trans.text_404 }}
        </p>

        <p class="text-muted mb-5">
            {{ trans.404_notice }}
        </p>

        <div class="row">
            <div class="col-xl-2 offset-xl-5">

                <a href="/" class="btn btn-primary">
                    {{ trans.text_go_home }}
                </a>

            </div>
        </div>

    </div>

</section>

{% endblock %}
