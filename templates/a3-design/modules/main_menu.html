{# templates/a3-design/modules/main_menu.html #}

<div class="row">
    <div class="site-menu col-9 col-xl-9">

<ul class="navbar-nav align-items-lg-center justify-content-lg-center js-overflow-menu"
    data-overflow-label="{{ trans.text_menu_more }}">

    {% for item in data.main_menu_items %}
        <li class="nav-item">
            <a class="nav-link{% if item.is_current %} state{% endif %}{% if item.css_class %} {{ item.css_class }}{% endif %}"
               href="{{ item.url }}"
               {% if item.is_current %}aria-current="page"{% endif %}>
                {{ item.name }}
            </a>
        </li>
    {% endfor %}

    <!--
    <li class="nav-item phone-item">
        {% if site_settings and site_settings.phones %}
            {% with primary=site_settings.phones|first %}
                <a class="nav-link" href="tel:{{ primary.value }}">{{ primary.value }}</a>
            {% endwith %}
        {% endif %}
    </li>

    <li class="nav-item call-item">
        <a class="btn menu-btn" href="#" data-bs-toggle="modal" data-bs-target="#orderCallModal">{{ trans.order_call }}</a>
    </li>
    -->

</ul>
</div>
<div class="account-menu col-3 col-xl-3">
    {% if is_logged %}
        <a
            href="{% url 'account_dashboard' %}"
            class="nav-link thin-button"
            aria-label="{{ trans.text_account }}"
        >
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span class="d-none d-sm-inline">{{ trans.text_account }}</span>
        </a>
    {% else %}
        <a
            href="#"
            class="nav-link thin-button"
            data-bs-toggle="modal"
            data-bs-target="#accountModal"
            aria-controls="accountModal"
            aria-label="{{ trans.text_account }}"
        >
            <i class="fa-solid fa-user" aria-hidden="true"></i>
            <span class="d-none d-sm-inline">{{ trans.text_account }}</span>
        </a>
    {% endif %}
</div>
</div>
