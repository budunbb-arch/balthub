<!-- /opt/balthub/templates/default/includes/plans_pagination.html -->

{% if page_obj.has_next %}
    <div data-pagination>
        <a
            href="{{ plans_url }}?rooms={{ rooms }}&page={{ page_obj.next_page_number }}"
            data-next-page
        >
            {{ trans.text_next }}
        </a>
    </div>
{% endif %}
