{# /opt/balthub/templates/default/modules/search.html #}

{% load static %}

<div class="col-12 col-md-10 col-lg-10 offset-lg-1 col-xxl-8 search module module-search">

    <div class="">
        <!--<h2 class="search-heading mb-2" data-textfit data-fill="0.7">{{ trans.search_heading }}</h2>-->
        <form action="{% url 'search_results' %}" method="get" class="row g-2 align-items-end" id="searchForm">

            <div class="col-9 col-sm-10 position-relative">
                <input type="text" name="q" class="form-control field-search" placeholder="{{ trans.search }}" value="{{ request.GET.q|default:'' }}">
            </div>
            <div class="col-3 col-sm-2">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass-location"></i></button>
            </div>
            <div class="col-12 col-md-2 search-filter position-relative d-none d-lg-flex">
                <select name="city" class="form-select">
                    <option value="">{{ trans.text_city }}</option>
                    {% for city in data.cities %}
                        <option value="{{ city.id }}" {% if request.GET.city == city.id|stringformat:"s" %}selected{% endif %}>{{ city.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 col-md-2 search-filter position-relative d-none d-lg-flex">
                <select name="district" class="form-select">
                    <option value="">{{ trans.text_district }}</option>
                    {% for district in data.districts %}
                        <option value="{{ district.id }}" data-city-id="{{ district.city_id }}" {% if request.GET.district == district.id|stringformat:"s" %}selected{% endif %}>{{ district.name }}</option>
                    {% endfor %}
                </select>
                <label class="position-absolute">{{ trans.text_district }}</label>
            </div>
            <div class="col-12 col-md-2 search-filter position-relative d-none d-lg-flex">
                <select name="property_type" class="form-select">
                    <option value="">{{ trans.text_property_type }}</option>
                    {% for pt in data.property_types %}
                        <option value="{{ pt.id }}" {% if request.GET.property_type == pt.id|stringformat:"s" %}selected{% endif %}>{{ pt.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 col-md-2 search-filter position-relative d-none d-lg-flex">
                <select name="rooms_alias" class="form-select">
                        <option value="">{{ trans.text_rooms }}</option>
                    {% for alias in data.rooms_aliases %}
                        <option value="{{ alias }}" {% if request.GET.rooms_alias == alias %}selected{% endif %}>{{ alias }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 col-md-2 search-filter position-relative d-none d-lg-flex">
                <select name="price_band" class="form-select">
                    <option value="">{{ trans.text_price }}</option>
                    {% for min_p, max_p, label in data.price_bands %}
                        <option value="{{ min_p }}-{{ max_p }}" {% if price_band == min_p|stringformat:"s"|add:"-"|add:max_p|stringformat:"s" %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

        </form>
    </div>
    <script src="{% static 'assets/js/search.js' %}"></script>
</div>
