{% load static %}

<div class="slider-captcha row" data-slider-captcha data-target="{{ captcha.target }}">
    <div class="col-2 d-flex align-items-center p-0">
        <img src="{% static 'assets/images/006.balthub-favicon-transparent.png' %}" class="img-fluid">
    </div>
    <div class="col-8">
        <div class="slider-captcha__header">
        </div>
        <div class="slider-captcha__scale" aria-hidden="true">
            <span class="slider-captcha__target" style="left: {{ captcha.target }}%;"></span>
        </div>
        <input class="slider-captcha__input" type="range" min="0" max="100" value="0"
            aria-label="Переместите ползунок к цели" data-captcha-slider>
        
        <input type="hidden" name="captcha_id" value="{{ captcha.id }}">
        <input type="hidden" name="captcha_value" value="" data-captcha-value>
    </div>
    <div class="col-2 d-flex align-items-center justify-content-center">
        <div class="slider-captcha__status" data-captcha-status role="status"></div>
    </div>
    <div class="col-12 hint text-small">
        {{ trans.captcha_manual }}
    </div>
</div>
