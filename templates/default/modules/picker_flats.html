{% load static %}
{% load image_utils %}

<div class="flats-pickers" data-picker-root data-picker>
    {% for picker in pickers %}
        {% if picker.type == "range" %}
            <div class="flat-picker mb-5" data-picker-name="{{ picker.name }}" data-auto-submit="{{ picker.auto_submit|yesno:'true,false' }}">
                
                <div class="picker-range">
                    <div class="picker-range-fields row">
                        <div class="d-flex align-items-center col-4">
                            <span class="picker-range-label">{{ picker.label }}</span>
                        </div>
                        <div class="d-flex align-items-center col-4">
                            <input
                                type="number"
                                class="picker-range-input"
                                placeholder="{{ picker.range.from_placeholder }}"
                                value="{{ picker.range.from_value|default:'' }}"
                                data-picker-range="{{ picker.range.from_name }}"
                            >
                        </div>
                        <div class="d-flex align-items-center col-4">
                            <input
                                type="number"
                                class="picker-range-input"
                                placeholder="{{ picker.range.to_placeholder }}"
                                value="{{ picker.range.to_value|default:'' }}"
                                data-picker-range="{{ picker.range.to_name }}"
                            >
                        </div>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="flat-picker mb-5" data-picker-name="{{ picker.name }}">
                <h4>{{ picker.placeholder }}</h4>
                <div class="flat-picker-options mt-2">
                    {% for option in picker.options %}
                        {% if option.image %}
                            <div class="form-check d-block align-items-center gap-2 mb-2 w-img position-relative">
                                <input
                                    class="form-check-input flex-shrink-0"
                                    type="checkbox"
                                    value="{{ option.value }}"
                                    data-picker-value
                                    id="flat-picker-{{ picker.name }}-{{ option.value }}"
                                >
                                <label
                                    class="form-check-label mb-0 row"
                                    for="flat-picker-{{ picker.name }}-{{ option.value }}"
                                >
                                    <div class="col-4">
                                        <img
                                            src="{{ option.image|image_variant:120 }}"
                                            alt=""
                                            class="picker-house-thumb"
                                            loading="lazy"
                                        >
                                    </div>
                                    <div class="col-8 d-flex align-items-center">
                                        <span>{{ option.label }}</span>
                                    </div>
                                </label>
                            </div>
                        {% else %}
                            <div class="form-check d-flex align-items-center gap-2 position-relative">
                                <input
                                    class="form-check-input flex-shrink-0"
                                    type="checkbox"
                                    value="{{ option.value }}"
                                    data-picker-value
                                    id="flat-picker-{{ picker.name }}-{{ option.value }}"
                                >
                                <label
                                    class="form-check-label mb-0"
                                    for="flat-picker-{{ picker.name }}-{{ option.value }}"
                                >
                                    {{ option.label }}
                                </label>
                            </div>
                        {% endif %}
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    {% endfor %}
</div>
