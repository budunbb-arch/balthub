<!-- /opt/balthub/templates/default/layout/header.html -->

{% load static %}

<header class="site-header">
    <div class="header-bg"></div>
    <div class="container-fluid">
        <div class="row">
            <nav class="navbar navbar-expand-lg navbar-light mb-4 p-2 py-3">
                <div class="col-6 col-sm-4 col-md-4 col-lg-2 col-xl-1 offset-xl-1" id="logo">
                    <a href="{{ trans.url_home }}">
                        <img src="{% static 'assets/images/002.balthub-logo-white.png' %}" alt="{{ trans.sitename }}" class="img-fluid">  
                    </a>
                </div>
                <div class="col-6 col-md-8 col-lg-10 col-xl-8 offset-xl-1 text-end" id="main-menu">
                    <!-- TOGGLER -->
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <!-- COLLAPSE -->
                    <div class="collapse navbar-collapse" id="mainNavbar">
                        <div class="ms-auto">
                            {% include "default/includes/render_modules.html" with modules=layout.main_menu %}
                        </div>
                    </div>
                </div>
            </nav>
        </div>
        <div class="row mb-5">
            {% include "default/includes/render_modules.html" with modules=layout.sitename %}
        </div>
        <div class="row">
            {% include "default/includes/render_modules.html" with modules=layout.search %}
        </div>
    </div>
</header>
