<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Сайт временно недоступен</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #263238;
            background: #f5f7f8;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            max-width: 560px;
            text-align: center;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.1;
        }

        p {
            margin: 0;
            color: #58666d;
            font-size: 1.125rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <main>
        <h1>Сайт временно недоступен</h1>
        <p>Мы проводим технические работы. Пожалуйста, зайдите позже.</p>
    </main>
</body>
</html>
