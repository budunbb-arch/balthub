services:
  db:
    image: postgres:16
    container_name: bh_database_box
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: bh_database
      POSTGRES_USER: bh_database_connect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: balthub_www_box
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8002:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DB_NAME: bh_database
      DB_USER: bh_database_connect
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings


  celery_worker:
    build: .
    container_name: balthub_celery_worker_box
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DB_NAME: bh_database
      DB_USER: bh_database_connect
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings

  celery_beat:
    build: .
    container_name: balthub_celery_beat_box
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DB_NAME: bh_database
      DB_USER: bh_database_connect
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings

  redis:
    image: redis:7-alpine
    container_name: balthub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
